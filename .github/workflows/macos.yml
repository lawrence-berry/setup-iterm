name: macOS

on:
  pull_request:
    paths-ignore: [ "**.md" ]
  push:
    branches: [main]
    paths-ignore: [ "**.md" ]

permissions:
  contents: read

jobs:
  changes:
    name: Code changed?
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A PR-level paths-ignore only skips PRs that are Markdown-only from the start, so each push is checked here.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$HEAD" | grep -qv '\.md$' || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  install:
    name: Install (macos-15)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh twice on the throwaway runner
        run: |
          export SHELL=/bin/zsh
          # A fresh runner has no iTerm profile; give install.sh the one it edits.
          defaults write com.googlecode.iterm2 'New Bookmarks' -array '<dict><key>Name</key><string>Default</string></dict>'
          ./install.sh
          ./install.sh
          defaults read com.googlecode.iterm2 Hotkey | grep -qx 1
          defaults read com.googlecode.iterm2 GlobalKeyMap | grep -q 0xf702-0x2c0000-0x0
          cmp karabiner.json ~/.config/karabiner/karabiner.json
          cmp snippets.plist "$HOME/Library/Application Support/iTerm2/snippets.plist"
          [ "$(grep -c '# setup-iterm$' ~/.zshrc)" -eq 1 ]
          [ "$(grep -c '# setup-iterm-badge' ~/.zshrc)" -eq 1 ]
